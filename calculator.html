<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  body { font-family: serif; margin: 16px; }
  h1 { text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  td { border: 1px solid #000; padding: 12px; }
  td.label { font-weight: bold; font-size: 1.2em; width: 40%; }
  input[type=number] { width: 100%; padding: 10px; font-size: 1em; box-sizing: border-box; }
  .center { text-align: center; }
  button { padding: 10px 20px; font-size: 1em; }
  #result { text-align: center; margin-top: 20px; font-size: 1.1em; }
  .home { text-align: center; margin-top: 40px; font-size: 1.4em; }
</style>
</head>
<body>
  <h1>Calculator</h1>
  <table>
    <tr>
      <td class="label">First Number:</td>
      <td><input type="number" id="num1" placeholder="Enter first number"></td>
    </tr>
    <tr>
      <td class="label">Second Number:</td>
      <td><input type="number" id="num2" placeholder="Enter second number"></td>
    </tr>
    <tr><td colspan="2" class="center"><button onclick="compute()">Compute</button></td></tr>
    <tr><td colspan="2" class="center"><button onclick="resetAll()">Reset</button></td></tr>
  </table>

  <div id="result"></div>
  <div class="home"><a href="juice.html">Home</a></div>

<script>
  function compute() {
    const a = parseFloat(document.getElementById('num1').value);
    const b = parseFloat(document.getElementById('num2').value);
    const out = document.getElementById('result');
    if (isNaN(a) || isNaN(b)) { out.textContent = 'Please enter both numbers.'; return; }
    out.innerHTML =
      'Sum: ' + (a + b) + '<br>' +
      'Difference: ' + (a - b) + '<br>' +
      'Product: ' + (a * b) + '<br>' +
      'Quotient: ' + (b === 0 ? 'Cannot divide by zero' : a / b);
  }
  function resetAll() {
    document.getElementById('num1').value = '';
    document.getElementById('num2').value = '';
    document.getElementById('result').innerHTML = '';
  }
</script>
</body>
</html>
