<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Drag and Drop Game</title>
    <link rel="stylesheet" href="DragAndDropG.css">
    <script src="DragAndDropG.js" defer></script>
</head>
<body>
    <div class="game-container">
        <h1>Food Sorting Game</h1>
        <p class="instruction">Drag each item into its correct category cuh!</p>

        
        <div class="draggableContainer">
            <div class="box" draggable="true" id="item1" data-category="food">Burger</div>
            <div class="box" draggable="true" id="item2" data-category="drink">Cola</div>
            <div class="box" draggable="true" id="item3" data-category="snack">Popcorn</div>
            <div class="box" draggable="true" id="item4" data-category="food">Pizza</div>
            <div class="box" draggable="true" id="item5" data-category="drink">Milk Tea</div>
            <div class="box" draggable="true" id="item6" data-category="snack">Donut</div>
            <div class="box" draggable="true" id="item7" data-category="snack">Chips</div>
            <div class="box" draggable="true" id="item8" data-category="drink">Water</div>
            <div class="box" draggable="true" id="item9" data-category="food">Spaghetti</div>
        </div>

        <div class="droppableContainer">
            <div class="droppable" data-category="food">
                <h3>Foods</h3>
            </div>
            <div class="droppable" data-category="drink">
                <h3>Drinks</h3>
            </div>
            <div class="droppable" data-category="snack">
                <h3>Snacks</h3>
                <a href = "portfolio.html"> Home </a>
            </div>
        </div>
    </div>
</body>
</html>
