<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Ziantino lao. Dela Cruz</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Carousel Styles -->
    <style>
        .carousel {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .slides {
            position: relative;
            height: 420px;
            width: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            display: none; 
        }

        .slide:first-child {
            display: block;
        }

        .slide img {
            width: 100%;
            height: 330px;
            object-fit: cover;
            display: block;
        }

        figcaption {
            padding: 15px;
            text-align: center;
            background: #fff;
            color: #555;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .nav {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 1.5rem;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 10;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .nav:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .prev {
            left: 15px;
        }

        .next {
            right: 15px;
        }
        
        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            background: #ccc;
            cursor: pointer;
            transition: background 0.3s ease;
            padding: 0;
        }

        .dot.active {
            background: #333;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="landingpage.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li class="active"><a href="gallery.html">Gallery</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <h1>Gallery:</h1>
        
        <!-- Carousel Image Code Inserted Here -->
        <div class="carousel" id="carousel">
            <div class="slides">
                <figure class="slide">
                    <img src="pic1.JPG" alt="Scenic landscape view showing mountains under a clear sky">
                    <figcaption>Caption for image 1</figcaption>
                </figure>
                <figure class="slide">
                    <img src="pic2.JPG" alt="Calm ocean waves washing onto a sandy beach">
                    <figcaption>Caption for image 2</figcaption>
                </figure>
                <figure class="slide">
                    <img src="pic3.JPG" alt="Dense green forest with sunlight filtering through the trees">
                    <figcaption>Caption for image 3</figcaption>
                </figure>
                <figure class="slide">
                    <img src="pic4.JPG" alt="Vibrant cityscape illuminated during the twilight hours">
                    <figcaption>Caption for image 4</figcaption>
                </figure>

                <button class="nav prev" type="button" aria-label="Previous slide">&#10094;</button>
                <button class="nav next" type="button" aria-label="Next slide">&#10095;</button>
            </div>
            <div class="dots"></div>
        </div>
    </main>

    <!-- Carousel Script -->
    <script>
        $(document).ready(function () {
            const $slides = $('.slide');
            const totalSlides = $slides.length;
            let currentIndex = 0;
            let timer = null;
            const intervalTime = 4000;
            
            $slides.each(function (index) {
                const $dot = $('<button class="dot" type="button" aria-label="Slide ' + (index + 1) + '"></button>');
                if (index === 0) $dot.addClass('active');
                $('.dots').append($dot);
            });

            const $dots = $('.dot');
            
            function showSlide(index) {
                currentIndex = (index + totalSlides) % totalSlides;
                $slides.stop(true, true).fadeOut(400);
                $slides.eq(currentIndex).stop(true, true).fadeIn(400);
                $dots.removeClass('active').eq(currentIndex).addClass('active');
            }

            function startAutoplay() {
                stopAutoplay(); 
                timer = setInterval(function () {
                    showSlide(currentIndex + 1);
                }, intervalTime);
            }

            function stopAutoplay() {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
            }

            function resetAutoplay() {
                stopAutoplay();
                startAutoplay();
            }

            $('.next').on('click', function () {
                showSlide(currentIndex + 1);
                resetAutoplay();
            });

            $('.prev').on('click', function () {
                showSlide(currentIndex - 1);
                resetAutoplay();
            });

            $('.dots').on('click', '.dot', function () {
                const index = $(this).index();
                showSlide(index);
                resetAutoplay();
            });

            startAutoplay();
            
            $('#carousel').on('mouseenter', stopAutoplay).on('mouseleave', startAutoplay);

            $(document).on('keydown', function (e) {
                if (e.key === 'ArrowRight') {
                    showSlide(currentIndex + 1);
                    resetAutoplay();
                } else if (e.key === 'ArrowLeft') {
                    showSlide(currentIndex - 1);
                    resetAutoplay();
                }
            });
        });
    </script>
</body>
</html>
