<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Java Script</title>
    <script>
        console.log("Hello World");
        var x = 100;
        var y = 30;
        var sum = x + y;
        var sub = x - y;
        var div = x / y;
        var mul = x * y;
        var mod = y % x;
        console.log(x + " + " + y + " = " + sum);
        console.log(x + " - " + y + " = " + sub);
        console.log(x + " / " + y + " = " + div);
        console.log(x + " * " + y + " = " + mul);
        console.log(x + " % " + y + " = " + mod);

        console.log(x + " > " + y + " = " + (x > y));
        console.log(x + " >= " + y + " = " + (x >= y));
        console.log(x + " < " + y + " = " + (x < y));
        console.log(x + " <= " + y + " = " + (x <= y));
        console.log(x + " == " + y + " = " + (x == y));
        console.log(x + " != " + y + " = " + (x != y));
        
        console.log(x + " && " + y + " = " + (x && y));
        console.log(x + " || " + y + " = " + (x || y));
    </script>
</head>
<body>
    <h1>Hey, It's Me. </h1>
    <a href="portfolio.html" style="text-align: center;"> Home </a>
</body>
</html>
