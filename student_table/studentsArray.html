<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabular Data</title>
    <script src="StudentScript.js" defer></script>
     <style>
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #0d47a1;
            color: white;
        }
        img {
            border-radius: 5px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <center>
    <table border="2">
        <thead>
            <tr>
                <th>LRN</th>
                <th>NAME</th>
                <th>AGE</th>
                <th>SECTION</th>
                <th>IMAGES</th>
            </tr>
        </thead>
        <tbody id="output">
        </tbody>
    </table>
         <a href ="portfolio.html"> Home </a>
    </center>
</body>
</html>
