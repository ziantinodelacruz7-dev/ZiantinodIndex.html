<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Drill - Ziantino Lao. Dela Cruz</title>
    
    <style>
        .svg-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .svg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .svg-card {
            background-color: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .svg-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.1);
        }

        .svg-card h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        svg {
            background-color: #ffffff;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <main class="svg-container">
        <div class="hero">
            <span class="hero-badge">SVG Graphics Drill</span>
            <h1>SVG Element Demonstrations</h1>
            <p>A collection of scalable vector graphics showcasing geometric shapes, groups, polygons, transformed text, and custom lines.</p>
        </div>

        <div class="svg-grid">
            <!-- 1. Circle Element -->
            <div class="svg-card">
                <h3>1 (circle element)</h3>
                <svg width="160" height="160" viewBox="0 0 160 160">
                    <rect x="15" y="15" width="130" height="130" fill="none" stroke="black" stroke-width="1.5"/>
                    <circle cx="80" cy="80" r="50" fill="#add8e6" stroke="blue" stroke-width="4"/>
                </svg>
            </div>

            <!-- 2. Group (g) Element -->
            <div class="svg-card">
                <h3>2 (g element)</h3>
                <svg width="160" height="160" viewBox="0 0 160 160">
                    <g stroke-width="4">
                        <rect x="20" y="40" width="60" height="40" fill="none" stroke="red"/>
                        <rect x="20" y="80" width="60" height="40" fill="none" stroke="red"/>
                        <rect x="80" y="40" width="60" height="80" fill="none" stroke="blue"/>
                    </g>
                </svg>
            </div>

            <!-- 3. Polygon Element -->
            <div class="svg-card">
                <h3>3 (polygon element)</h3>
                <svg width="160" height="160" viewBox="0 0 160 160" style="background-color: black;">
                    <polygon points="80,15 130,140 20,140" fill="blue" stroke="red" stroke-width="1"/>
                    <polygon points="80,80 100,120 60,100" fill="blue" stroke="red" stroke-width="1"/>
                </svg>
            </div>

            <!-- 4. Text Element -->
            <div class="svg-card">
                <h3>4 (text element)</h3>
                <svg width="160" height="160" viewBox="0 0 160 160">
                    <text x="50" y="40" fill="blue" font-family="Plus Jakarta Sans" font-weight="bold" font-size="16" transform="rotate(25, 50, 40)">Ziantino</text>
                    <text x="30" y="80" fill="blue" font-family="Plus Jakarta Sans" font-weight="bold" font-size="16" transform="rotate(90, 30, 80)">Dela Cruz</text>
                </svg>
            </div>

            <!-- 5. Line Element -->
            <div class="svg-card">
                <h3>5 (line element)</h3>
                <svg width="160" height="160" viewBox="0 0 160 160">
                    <line x1="25" y1="35" x2="135" y2="125" stroke="blue" stroke-width="4"/>
                </svg>
            </div>
        </div>
    </main>

</body>
</html>
