<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - John Mark R. Erandio</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f0f4f9 !important;
            margin: 0 !important;
            font-family: Arial, sans-serif !important;
        }

      
        header nav {
            background-color: #0d47a1 !important;
            padding: 12px 0 !important;
            text-align: center !important;
        }

        header nav ul {
            list-style: none !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            justify-content: center !important;
            gap: 15px !important;
        }

        header nav ul li a {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 14px !important;
            font-weight: bold !important;
            padding: 8px 14px !important;
            border-radius: 4px !important;
            transition: 0.3s !important;
        }

        header nav ul li a.active,
        header nav ul li a:hover {
            background-color: #1976d2 !important;
            color: #ffffff !important;
        }

        .grid-container {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 18px !important;
            list-style-type: none !important;
            padding: 0 !important;
            margin: 30px auto !important;
            max-width: 1100px !important;
        }

        .grid-container li {
            list-style: none !important;
        }

        .portfolio-card {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            height: 65px !important;
            background-color: #e3f2fd !important;
            color: #0d47a1 !important; /* Dark Blue Text */
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 15px !important;
            text-align: center !important;
            padding: 10px !important;
            
            border: 3px double #1565c0 ;
            border-radius: 8px ;
            box-sizing: border-box ;
            transition: all 0.2s ease-in-out ;
        }

        
        .portfolio-card:hover {
            background-color: #1565c0 !important;
            color: #ffffff !important;
            border-color: #0d47a1 !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 10px rgba(13, 71, 161, 0.2) !important;
        }

        @media (max-width: 800px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        @media (max-width: 500px) {
            .grid-container {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>
<body>   
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="portfolio.html" class="active">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 20px;">
        <ul class="grid-container">
            <li><a href="form-elements.html" class="portfolio-card">Form Elements</a></li>
            <li><a href="calculator.html" class="portfolio-card">Sample Calculator</a></li>
            <li><a href="discount.html" class="portfolio-card">Discount Calculator</a></li>
            <li><a href="schedule.html" class="portfolio-card">Grade 12 Cooper Schedule</a></li>
            <li><a href="portal-login.html" class="portfolio-card">Student Portal</a></li>
            <li><a href="studentsArray.html" class="portfolio-card">Student Array Table</a></li>
            <li><a href="gridOnDemo.html" class="portfolio-card">CSS Grid Demo</a></li>
            <li><a href="index.html" class="portfolio-card">Login Logic</a></li>
        </ul>
    </main>

</body>
</html>
