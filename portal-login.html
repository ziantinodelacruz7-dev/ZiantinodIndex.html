<!DOCTYPE html>
<html>
<head>
    <title>Portal Login</title>
    <style>
        body {
            background-color: #e3f2fd; /* Soft light blue background */
            font-family: Arial, sans-serif;
            color: #0d47a1; /* Deep blue text */
        }

        table {
            border: 2px solid #64b5f6;
            border-collapse: collapse;
            background-color: #ffffff;
            margin-top: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background-color: #1976d2; /* Vibrant header blue */
            color: white;
            text-align: center;
        }

        h2 {
            margin: 0;
            padding: 12px;
        }

        tbody td {
            padding: 10px;
            color: #1565c0;
        }

        input {
            padding: 7px;
            border: 1px solid #90caf9;
            background-color: #f5f9ff;
            border-radius: 4px;
        }

        tfoot td {
            padding: 10px;
            text-align: center;
            color: #1976d2;
        }

        input[type="submit"] {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #1565c0;
        }

        input[type="reset"] {
            background-color: #90caf9; /* Fixed typo from lightblur */
            color: #0d47a1;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="reset"]:hover {
            background-color: #64b5f6;
        }

        p {
            text-align: center;
        }

        p a {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <form>
        <table align="center">
            <thead>
                <tr>
                    <td colspan="2">
                        <h2>Portal Login</h2>
                    </td>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <label for="username">Username:</label>
                    </td>
                    <td>
                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="Enter Username">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="password">Password:</label>
                    </td>
                    <td>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter Password">
                    </td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="2">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Created by: Ziantino
                    </td>
                </tr>
            </tfoot>
        </table>
    </form>
    
    <p><a href="landingpage.html">Home</a></p>
</body>
</html>
